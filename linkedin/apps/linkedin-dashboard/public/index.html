<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinkedIn Intelligence</title>
<style>
:root{--paper:#0b0d0b;--ink:#5cff8a;--dim:rgba(92,255,138,.24);--soft:rgba(92,255,138,.62);--text:#e8f0e8;--muted:#9fb3a6;--alert:#ff5c5c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--text);font:16px/1.45 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;background-image:radial-gradient(rgba(92,255,138,.14) 1px,transparent 1.3px);background-size:12px 18px}.shell{max-width:1320px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;gap:24px;border-bottom:1px solid var(--dim);padding-bottom:22px;align-items:end}.kicker,.meta{font-size:12px;color:var(--soft);letter-spacing:.08em}.title{margin:7px 0 0;font:800 clamp(32px,5vw,64px)/.95 system-ui,sans-serif;letter-spacing:-.06em}.grid{display:grid;gap:16px;margin-top:24px}.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}.cols{grid-template-columns:1.3fr .7fr}.card{border:1px solid var(--dim);background:rgba(11,13,11,.9);padding:18px;position:relative}.tag{position:absolute;top:-10px;left:12px;background:var(--paper);padding:0 8px;color:var(--soft);font-size:12px}.metric{font:800 38px/1 system-ui,sans-serif;margin:12px 0 7px}.muted{color:var(--muted)}.warning{color:#ffcc6a}.row{padding:13px 0;border-bottom:1px dashed var(--dim)}.row:last-child{border:0}.row strong{display:block;font-family:system-ui,sans-serif;font-size:17px}.pill{display:inline-block;border:1px solid var(--dim);padding:3px 7px;color:var(--soft);font-size:12px;margin-top:5px}.active{color:var(--ink);border-color:var(--ink)}a{color:var(--ink);text-decoration:none}a:hover{text-decoration:underline}.table{width:100%;border-collapse:collapse}.table th{color:var(--soft);text-align:left;font-size:12px;font-weight:500;padding:10px 8px;border-bottom:1px solid var(--dim)}.table td{padding:12px 8px;border-bottom:1px solid var(--dim);vertical-align:top}.status{font-size:12px}.status.active{color:var(--ink)}.status.planned{color:var(--muted)}.empty{padding:12px;border:1px dashed var(--dim);color:var(--muted)}@media(max-width:800px){.shell{padding:20px}.metrics,.cols{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}.table{font-size:13px}.table th:nth-child(3),.table td:nth-child(3){display:none}}
</style>
</head>
<body><main class="shell"><header class="top"><div><div class="kicker">┤ marfitsynn / linkedin intelligence ├</div><h1 class="title">CONTENT<br><span style="color:var(--ink)">CONTROL ROOM</span></h1></div><div class="meta" id="generated">loading…</div></header>
<section class="grid cols"><div class="card"><span class="tag">FEED · LAST 7 DAYS</span><div id="feed-stats"></div><div class="muted" style="margin-top:12px">token <input id="feed-token" type="password" placeholder="FEED_TOKEN" style="background:transparent;border:1px solid var(--dim);color:var(--text);padding:4px 8px;font:inherit;width:220px"></div></div><div class="card"><span class="tag">FEED · OFFERED / SHOWN / PICKED</span><div id="feed-items"></div></div></section>
<section class="grid metrics" id="metrics" data-legacy></section>
<section class="grid cols" data-legacy><div class="card"><span class="tag">LATEST POSTS</span><div id="posts"></div></div><div class="card"><span class="tag">ACTIVE WORK</span><div id="active"></div></div></section>
<section class="grid cols" data-legacy><div class="card"><span class="tag">SOURCES</span><div id="sources"></div></div><div class="card"><span class="tag">CRON / QUEUES</span><div id="queues"></div></div></section>
</main><script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const empty=t=>`<div class="empty">${esc(t)}</div>`;
fetch('./data.json').then(r=>window.feedHideLegacyOn404?window.feedHideLegacyOn404(r):r).then(r=>r&&r.json()).then(d=>{if(!d)return;document.querySelector('#generated').textContent='REFRESHED '+new Date(d.generated_at).toLocaleString();document.querySelector('#metrics').innerHTML=[['FOLLOWERS',d.analytics.followers??'—','needs LinkedIn adapter'],['30D VIEWS',d.analytics.impressions_30d??'—','needs LinkedIn adapter'],['COMMENTS TO REPLY',d.analytics.comments_to_reply??'—','approval-gated']].map(([k,v,n])=>`<div class="card"><span class="tag">${k}</span><div class="metric">${v}</div><div class="muted">${n}</div></div>`).join('');document.querySelector('#posts').innerHTML=d.latest_posts.length?d.latest_posts.map(p=>`<div class="row"><strong>${esc(p.hook||p.topic||'Untitled')}</strong><span class="pill">${esc(p.topic||'post')}</span> <span class="pill">${esc(p.published_at||'')}</span><br><a href="https://www.linkedin.com/feed/update/${encodeURIComponent(p.urn)}/" target="_blank">open live post →</a></div>`).join(''):empty('No archived posts yet.');document.querySelector('#active').innerHTML=d.active_items.length?d.active_items.map(x=>`<div class="row"><strong>${esc(x.title)}</strong><span class="pill ${x.status==='posted'?'active':''}">${esc(x.status)}</span><div class="muted">${esc(x.note)}</div></div>`).join(''):empty('No active items.');document.querySelector('#sources').innerHTML=d.sources.map(s=>`<div class="row"><strong><a href="${esc(s.url)}" target="_blank">${esc(s.name)} →</a></strong><span class="pill ${s.status==='active'?'active':''}">${esc(s.type)} · ${esc(s.status)}</span></div>`).join('');document.querySelector('#queues').innerHTML=d.queues.map(q=>`<div class="row"><strong>${esc(q.name)}</strong><span class="pill ${q.status==='active'?'active':''}">${esc(q.schedule)} · ${esc(q.status)}</span><div class="muted">${esc(q.purpose)}</div></div>`).join('')}).catch(e=>{document.body.insertAdjacentHTML('beforeend',`<pre>${esc(e.message)}</pre>`)})
</script><script src="./feed.js"></script></body></html>
